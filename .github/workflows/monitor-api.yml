name: Monitor API

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  production-healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check production API and pharmacy coverage
        run: pnpm --filter api healthcheck:prod
