name: Check Price Alerts

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = 09:00 Chile (hora de verano)
  workflow_dispatch:       # también ejecutable manualmente

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar revisión diaria de alertas de precio
        id: check-alerts
        run: |
          curl -sf "https://comparafarma-api.vercel.app/api/alerts?action=check&secret=${{ secrets.CRON_SECRET }}" \
            -o response.json
          echo "Respuesta:"
          cat response.json
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        continue-on-error: true

      - name: Create issue on check-price-alerts failure
        if: steps.check-alerts.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = 'response.json';
            const body = fs.existsSync(path)
              ? `Falló la revisión diaria de alertas de precio (\`check-price-alerts.yml\`).\n\n\`\`\`json\n${fs.readFileSync(path, 'utf8')}\n\`\`\``
              : 'Falló la revisión diaria de alertas de precio (`check-price-alerts.yml`), sin respuesta capturada.';
            const title = `Price alerts check failure - ${new Date().toISOString().slice(0, 16)}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['monitoring', 'bug'],
              assignees: [context.repo.owner]
            });

      - name: Fail job if check-alerts failed
        if: steps.check-alerts.outcome == 'failure'
        run: exit 1
