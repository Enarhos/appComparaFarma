name: Update MINSAL Branches

on:
  schedule:
    - cron: "0 9 * * *"   # 9:00 UTC = 06:00 Chile (hora de verano)
  workflow_dispatch:       # también ejecutable manualmente

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and merge MINSAL data
        id: fetch-branches
        run: node scripts-temp/fetch-branches.js
        continue-on-error: true

      - name: Commit if data changed
        if: steps.fetch-branches.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/src/data/branches.json api/src/data/branches-data.ts
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos en los datos de MINSAL."
          else
            git commit -m "data: update MINSAL branches (acumulado)"
            git push
          fi

      - name: Create issue on update-branches failure
        if: steps.fetch-branches.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Update MINSAL branches failure - ${new Date().toISOString().slice(0, 16)}`;
            const body = 'Falló el fetch/merge de datos de sucursales MINSAL (`update-branches.yml`, step "Fetch and merge MINSAL data"). Revisar logs del run para el error real (MINSAL bloquea IPs de Vercel en runtime; este workflow corre desde GitHub Actions, no debería verse afectado por eso, pero puede fallar por otras razones — formato de datos cambiado, timeout, etc.).';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['monitoring', 'bug'],
              assignees: [context.repo.owner]
            });

      - name: Fail job if fetch-branches failed
        if: steps.fetch-branches.outcome == 'failure'
        run: exit 1
