<text x='40.0' y='44.0' font-family='Arial, Helvetica, sans-serif' font-size='22' font-weight='700' fill='#1B1F23' text-anchor='start'>Comparison Card</text><text x='40.0' y='68.0' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#454B52' text-anchor='start'>El componente más importante del producto. Combina Channel Bar, Price Block, Savings Arc y Price</text><text x='40.0' y='88.0' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#454B52' text-anchor='start'>Break Marker en una sola unidad — comunica ganador, diferencia, ahorro, canal y farmacia sin que la</text><text x='40.0' y='108.0' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#454B52' text-anchor='start'>persona tenga que leer cada dato por separado.</text>
