<text x='40.0' y='852.0' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='normal' fill='#454B52' text-anchor='start'>El único elemento que distingue a la tarjeta ganadora es un hecho ya calculado por la plataforma (effective = min(...))</text>
<text x='40.0' y='872.0' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='normal' fill='#454B52' text-anchor='start'>— nunca una preferencia editorial. Cualquier farmacia puede ser la ganadora; el componente es idéntico para las nueve.</text>
