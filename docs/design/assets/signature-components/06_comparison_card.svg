<text x='40.0' y='258.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#454B52' text-anchor='start'>1. Marca ComparaFarma (bullet) — nunca el logo de la farmacia, mismo tratamiento para todas.</text>
<text x='40.0' y='278.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#454B52' text-anchor='start'>2. Nombre de la farmacia.</text>
<text x='40.0' y='298.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#454B52' text-anchor='start'>3. Channel Bar compacto — mismo componente, mismo orden, siempre.</text>
<text x='40.0' y='318.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#454B52' text-anchor='start'>4. Badge "Mejor precio" — solo aparece si el hecho ya fue calculado (menor precio efectivo).</text>
<text x='40.0' y='338.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#454B52' text-anchor='start'>5. Savings Arc compacto — solo en la tarjeta ganadora.</text>
<text x='40.0' y='358.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#454B52' text-anchor='start'>6. Price Block — escala Primary en el ganador.</text>
<text x='40.0' y='378.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#454B52' text-anchor='start'>7. Franja superior + borde Success — único tratamiento "elevado" permitido, nace del mismo hecho ya calculado, no de una decisión propia del componente.</text>
<text x='40.0' y='420.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='700' fill='#7C848C' text-anchor='start' letter-spacing='0.5'>VARIANTE — GANADOR VS. COMPARADO</text>
