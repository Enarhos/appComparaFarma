<text x='40.0' y='794.0' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='normal' fill='#454B52' text-anchor='start'>Cada estado combina forma (ficha llena / ficha con borde / ficha con trama) y glifo — nunca depende solo del color, coherente con el riesgo de daltonismo ya documentado en COLOR_RESEARCH.md.</text>
<text x='40.0' y='814.0' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='normal' fill='#454B52' text-anchor='start'>Ninguna farmacia recibe una ficha distinta a otra por decisión propia del componente — el mismo criterio de Neutralidad ya exigido en COMPONENT_LIBRARY.md §4.6.</text>
