<text x='40.0' y='44.0' font-family='Arial, Helvetica, sans-serif' font-size='22' font-weight='700' fill='#1B1F23' text-anchor='start'>Savings Arc</text><text x='40.0' y='68.0' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#454B52' text-anchor='start'>Arco parcial que representa, de forma proporcional, cuánto se ahorra sobre el precio más caro</text><text x='40.0' y='88.0' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#454B52' text-anchor='start'>comparado. Nunca cierra en 360° — siempre queda un vano de 60°, mismo principio de "algo por</text><text x='40.0' y='108.0' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#454B52' text-anchor='start'>descubrir" ya declarado en DISTINCTIVE_PRODUCT_IDENTITY.md.</text>
<text x='40.0' y='120.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='700' fill='#7C848C' text-anchor='start' letter-spacing='0.5'>GEOMETRÍA BASE</text>
<text x='40.0' y='142.0' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='normal' fill='#454B52' text-anchor='start'>Pista siempre en Neutral-200. Progreso siempre en Accent (#0D827B) — nunca en Success, para separar "métrica propia del producto" de "confirmación puntual".</text>
<text x='40.0' y='162.0' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='normal' fill='#454B52' text-anchor='start'>Barrido máximo 300° (vano fijo de 60°). El ahorro se expresa proporcional hasta un techo visual de 30% — a partir de ahí el arco ya se ve "casi lleno" sin llegar nunca a cerrarse.</text>
