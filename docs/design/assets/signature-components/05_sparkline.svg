<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 1000' width='1280' height='1000'>
<rect x='0.0' y='0.0' width='1280.0' height='1000.0' rx='0' fill='#F5F6F7'/>
<text x='40.0' y='44.0' font-family='Arial, Helvetica, sans-serif' font-size='22' font-weight='700' fill='#1B1F23' text-anchor='start'>Sparkline</text><text x='40.0' y='68.0' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#454B52' text-anchor='start'>El lenguaje oficial para historial de precios. No es un gráfico de barras genérico: solo marca un</text><text x='40.0' y='88.0' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#454B52' text-anchor='start'>punto donde el precio cambió de verdad. Los tramos sin cambio se leen como una línea recta — la</text><text x='40.0' y='108.0' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#454B52' text-anchor='start'>ausencia de puntos es información, no un vacío de datos.</text>
<text x='40.0' y='120.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='700' fill='#7C848C' text-anchor='start' letter-spacing='0.5'>REGLA DE TRAZO</text>
<text x='40.0' y='142.0' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='normal' fill='#454B52' text-anchor='start'>Línea de 2px. Tramo estable en Neutral-300. Tramo de baja en Success, tramo de alza en Warning — mismos tokens ya usados</text>
<text x='40.0' y='162.0' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='normal' fill='#454B52' text-anchor='start'>en Price Break Marker, nunca colores nuevos. Punto de 3.5px en cada cambio; 5px + halo cuando el cambio supera 8%.</text>
<text x='40.0' y='180.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='700' fill='#7C848C' text-anchor='start' letter-spacing='0.5'>LEYENDA</text>
<line x1='40.0' y1='204.0' x2='80.0' y2='204.0' stroke='#C2C7CC' stroke-width='2' stroke-linecap='round'/>
<text x='92.0' y='208.0' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='normal' fill='#454B52' text-anchor='start'>Estable</text>
