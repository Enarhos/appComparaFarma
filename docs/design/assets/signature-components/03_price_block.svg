<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 1040' width='1280' height='1040'>
<rect x='0.0' y='0.0' width='1280.0' height='1040.0' rx='0' fill='#F5F6F7'/>
<text x='40.0' y='44.0' font-family='Arial, Helvetica, sans-serif' font-size='22' font-weight='700' fill='#1B1F23' text-anchor='start'>Price Block</text><text x='40.0' y='68.0' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#454B52' text-anchor='start'>El lenguaje tipográfico oficial de cualquier precio en ComparaFarma. Una única forma correcta de</text><text x='40.0' y='88.0' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#454B52' text-anchor='start'>mostrar un número de precio — nunca dos productos distintos resolviendo el mismo dato con un</text><text x='40.0' y='108.0' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#454B52' text-anchor='start'>tratamiento distinto.</text>
<text x='40.0' y='120.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='700' fill='#7C848C' text-anchor='start' letter-spacing='0.5'>ESCALAS OFICIALES</text>
<text x='40.0' y='184.0' font-family='Arial, Helvetica, sans-serif' text-anchor='start'><tspan font-size='19.2' font-weight='600' fill='#7C848C'>$</tspan><tspan dx='2' font-size='32' font-weight='700' fill='#1B1F23'>1.990</tspan></text>
<text x='260.0' y='170.0' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='700' fill='#1B1F23' text-anchor='start'>Display</text>
<text x='260.0' y='190.0' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='normal' fill='#7C848C' text-anchor='start'>32px / 700 — bloque destacado, Home, callout de ahorro</text>
<text x='40.0' y='254.0' font-family='Arial, Helvetica, sans-serif' text-anchor='start'><tspan font-size='10.8' font-weight='600' fill='#7C848C'>$</tspan><tspan dx='2' font-size='18' font-weight='700' fill='#1B1F23'>1.990</tspan></text>
<text x='260.0' y='240.0' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='700' fill='#1B1F23' text-anchor='start'>Primary</text>
<text x='260.0' y='260.0' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='normal' fill='#7C848C' text-anchor='start'>18px / 700 — precio principal de una fila o tarjeta</text>
<text x='40.0' y='324.0' font-family='Arial, Helvetica, sans-serif' text-anchor='start'><tspan font-size='8.4' font-weight='600' fill='#7C848C'>$</tspan><tspan dx='2' font-size='14' font-weight='600' fill='#454B52'>1.990</tspan></text>
<text x='260.0' y='310.0' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='700' fill='#1B1F23' text-anchor='start'>Secondary</text>
<text x='260.0' y='330.0' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='normal' fill='#7C848C' text-anchor='start'>14px / 600 — precio de contexto, no ganador, tono Neutral-500</text>
<text x='40.0' y='400.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='700' fill='#7C848C' text-anchor='start' letter-spacing='0.5'>SÍMBOLO $ Y CIFRAS</text>
<text x='40.0' y='422.0' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='normal' fill='#454B52' text-anchor='start'>El símbolo $ siempre antecede al número, a 60% del tamaño del número y en Neutral-500 — nunca en el mismo peso ni el mismo color que la cifra, para que el número gane siempre la lectura.</text>
<text x='40.0' y='442.0' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='normal' fill='#454B52' text-anchor='start'>Cifras siempre tabulares (ancho de dígito fijo) para que columnas de precios comparen limpio. Separador de miles: punto. Nunca se muestran decimales — el peso chileno no los usa.</text>
<text x='40.0' y='478.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='700' fill='#7C848C' text-anchor='start' letter-spacing='0.5'>REGLA DE MILES Y DECIMALES</text>
<text x='40.0' y='510.0' font-family='Arial, Helvetica, sans-serif' text-anchor='start'><tspan font-size='10.8' font-weight='600' fill='#7C848C'>$</tspan><tspan dx='2' font-size='18' font-weight='700' fill='#1B1F23'>12.990</tspan></text>
<text x='160.0' y='506.0' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='600' fill='#2B8354' text-anchor='start'>correcto — punto de miles, sin decimales</text>
<text x='40.0' y='540.0' font-family='Arial, Helvetica, sans-serif' font-size='18' font-weight='700' fill='#C2C7CC' text-anchor='start'>$1.990,50</text>
<line x1='38' y1='533' x2='150' y2='533' stroke='#B23B33' stroke-width='2'/>
<text x='160.0' y='540.0' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='600' fill='#B23B33' text-anchor='start'>incorrecto — CLP no usa decimales</text>
<text x='40.0' y='590.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='700' fill='#7C848C' text-anchor='start' letter-spacing='0.5'>ALINEACIÓN — TABULAR EN LISTAS, LIBRE EN DESTACADOS</text>
<rect x='40.0' y='610.0' width='560.0' height='180.0' rx='10' fill='#FFFFFF' stroke='#C2C7CC' stroke-width='1'/>
<text x='64.0' y='644.0' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#454B52' text-anchor='start'>Cruz Verde</text>
<text x='576.0' y='644.0' font-family='Arial, Helvetica, sans-serif' text-anchor='end'><tspan font-size='10.8' font-weight='600' fill='#7C848C'>$</tspan><tspan dx='2' font-size='18' font-weight='700' fill='#1B1F23'>1.990</tspan></text>
<text x='64.0' y='680.0' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#454B52' text-anchor='start'>Salcobrand</text>
<text x='576.0' y='680.0' font-family='Arial, Helvetica, sans-serif' text-anchor='end'><tspan font-size='10.8' font-weight='600' fill='#7C848C'>$</tspan><tspan dx='2' font-size='18' font-weight='700' fill='#1B1F23'>2.150</tspan></text>
<text x='64.0' y='716.0' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#454B52' text-anchor='start'>Ahumada</text>
<text x='576.0' y='716.0' font-family='Arial, Helvetica, sans-serif' text-anchor='end'><tspan font-size='10.8' font-weight='600' fill='#7C848C'>$</tspan><tspan dx='2' font-size='18' font-weight='700' fill='#1B1F23'>2.390</tspan></text>
<text x='64.0' y='752.0' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#454B52' text-anchor='start'>EasyFarma</text>
<text x='576.0' y='752.0' font-family='Arial, Helvetica, sans-serif' text-anchor='end'><tspan font-size='10.8' font-weight='600' fill='#7C848C'>$</tspan><tspan dx='2' font-size='18' font-weight='700' fill='#1B1F23'>2.490</tspan></text>
<text x='64.0' y='626.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#7C848C' text-anchor='start'>En listas: siempre alineado a la derecha de su columna.</text>
<rect x='640.0' y='610.0' width='600.0' height='180.0' rx='10' fill='#FFFFFF' stroke='#C2C7CC' stroke-width='1'/>
<text x='664.0' y='644.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#7C848C' text-anchor='start'>En bloques destacados (hero, callout): alineado a la izquierda, sin competir con una columna.</text>
<text x='664.0' y='720.0' font-family='Arial, Helvetica, sans-serif' text-anchor='start'><tspan font-size='19.2' font-weight='600' fill='#7C848C'>$</tspan><tspan dx='2' font-size='32' font-weight='700' fill='#0D827B'>500</tspan></text>
<text x='1264.0' y='1026.0' font-family='Arial, Helvetica, sans-serif' font-size='10' font-weight='normal' fill='#7C848C' text-anchor='end'>ComparaFarma — Signature Components v1 (BRAND-003) · Price Block</text>
