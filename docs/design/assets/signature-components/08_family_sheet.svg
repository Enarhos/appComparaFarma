<text x='40.0' y='676.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='700' fill='#7C848C' text-anchor='start' letter-spacing='0.5'>REGLAS COMPARTIDAS</text>
<text x='40.0' y='696.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#454B52' text-anchor='start'>Radios: 10 (card) · 8 (botón) · 6 (ficha/tag) — mismo escalón en los siete componentes.</text>
<text x='40.0' y='712.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#454B52' text-anchor='start'>Grosor de trazo de datos: 6-8px en Savings Arc y Channel Bar, 2px en Sparkline — nunca un grosor arbitrario nuevo.</text>
<text x='40.0' y='728.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#454B52' text-anchor='start'>Color de "métrica propia": siempre Accent. Color de "confirmación puntual": siempre Success. Ningún componente usa Warning o Error para algo que no sea alza de precio o error real.</text>
<text x='40.0' y='744.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#454B52' text-anchor='start'>Tipografía: Inter en los siete, sin excepción — ninguno introduce una familia o un peso fuera de la escala ya oficial de Price Block.</text>
<text x='1264.0' y='746.0' font-family='Arial, Helvetica, sans-serif' font-size='10' font-weight='normal' fill='#7C848C' text-anchor='end'>ComparaFarma — Signature Components v1 (BRAND-003) · Family Sheet</text>
