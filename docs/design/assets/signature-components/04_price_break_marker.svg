<rect x='0.0' y='0.0' width='1280.0' height='900.0' rx='0' fill='#F5F6F7'/>
<text x='40.0' y='44.0' font-family='Arial, Helvetica, sans-serif' font-size='22' font-weight='700' fill='#1B1F23' text-anchor='start'>Price Break Marker</text><text x='40.0' y='68.0' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#454B52' text-anchor='start'>El indicador oficial de cambio de precio. No es una flecha bursátil ni un sticker: es una etiqueta</text><text x='40.0' y='88.0' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#454B52' text-anchor='start'>con un solo borde inclinado a 7° — silueta que no se repite en ningún otro componente del sistema</text><text x='40.0' y='108.0' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#454B52' text-anchor='start'>(todos los demás badges son píldoras o rectángulos rectos).</text>
<text x='40.0' y='120.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='700' fill='#7C848C' text-anchor='start' letter-spacing='0.5'>FORMA — POR QUÉ NO ES UNA FLECHA</text>
<text x='40.0' y='142.0' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='normal' fill='#454B52' text-anchor='start'>Una flecha o un ícono financiero traería, sin pedirlo, el territorio visual de mercados bursátiles — restringido en DESIGN_BRIEF.md. El corte diagonal es propio del sistema, no prestado de otra categoría de producto.</text>
<text x='40.0' y='180.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='700' fill='#7C848C' text-anchor='start' letter-spacing='0.5'>TAMAÑOS</text>
