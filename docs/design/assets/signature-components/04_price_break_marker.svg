<polygon points='527.0,320.0 640.0,320.0 633.0,352.0 520.0,352.0' fill='#2B8354'/><text x='580.0' y='340.2' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='700' fill='#FFFFFF' text-anchor='middle'>-18%</text>
