<text x='30.0' y='378.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#464440' text-anchor='start'>· Space Grotesk tiene una geometría distintiva y segura de sí misma, coherente con "Confidence" sin caer en el registro genérico de Inter.</text>
<text x='30.0' y='398.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#464440' text-anchor='start'>· Su carácter ligeramente técnico refuerza Minimal Tech sin sacrificar calidez en tamaños grandes de titular.</text>
<text x='30.0' y='418.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#464440' text-anchor='start'>· Funciona bien con muy pocos pesos en pantalla, coherente con la disciplina "un acento, pocos elementos" de esta propuesta.</text>
<text x='30.0' y='438.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#464440' text-anchor='start'>· Es de uso libre y ya adoptada por productos tech modernos citados en el benchmark aprobado.</text>
<text x='30.0' y='458.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#464440' text-anchor='start'>· Exploración visual únicamente — no constituye una decisión de TYPOGRAPHY_SYSTEM.</text>
