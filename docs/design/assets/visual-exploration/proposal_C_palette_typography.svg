<text x='30.0' y='352.0' font-family='Verdana, Arial, sans-serif' font-size='15' font-weight='700' fill='#231F1A' text-anchor='start'>Tipografía propuesta: Manrope</text>
<text x='30.0' y='378.0' font-family='Verdana, Arial, sans-serif' font-size='11' font-weight='normal' fill='#585045' text-anchor='start'>· Manrope combina terminales suaves con una estructura geométrica clara: calidez sin perder seriedad, tensión exacta que pide "Guidance".</text>
<text x='30.0' y='398.0' font-family='Verdana, Arial, sans-serif' font-size='11' font-weight='normal' fill='#585045' text-anchor='start'>· Es humanista sin volverse decorativa, coherente con "Cercana" sin sacrificar "Científica/Profesional".</text>
<text x='30.0' y='418.0' font-family='Verdana, Arial, sans-serif' font-size='11' font-weight='normal' fill='#585045' text-anchor='start'>· Mantiene buena densidad en pantallas móviles, prioridad ya fijada para ComparaFarma.</text>
<text x='30.0' y='438.0' font-family='Verdana, Arial, sans-serif' font-size='11' font-weight='normal' fill='#585045' text-anchor='start'>· Se aleja deliberadamente del registro "developer tool" de Inter/Space Grotesk, reforzando el eje Human + Technology.</text>
<text x='30.0' y='458.0' font-family='Verdana, Arial, sans-serif' font-size='11' font-weight='normal' fill='#585045' text-anchor='start'>· Exploración visual únicamente — no constituye una decisión de TYPOGRAPHY_SYSTEM.</text>
