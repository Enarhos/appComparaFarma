<text x='30.0' y='378.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#454C56' text-anchor='start'>· Inter es la fuente UI dominante del mercado 2026 para producto denso en datos, con excelente soporte de cifras tabulares para alinear precios.</text>
<text x='30.0' y='398.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#454C56' text-anchor='start'>· Su neutralidad geométrica refuerza "Precision" sin distraer del contenido numérico comparativo.</text>
<text x='30.0' y='418.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#454C56' text-anchor='start'>· Es la elección más segura para legibilidad en pantallas pequeñas — requisito ya fijado para ComparaFarma.</text>
<text x='30.0' y='438.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#454C56' text-anchor='start'>· Coincide con la referencia de mercado ya citada en el benchmark aprobado (VISUAL-001) para el eje Data Intelligence.</text>
<text x='30.0' y='458.0' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='normal' fill='#454C56' text-anchor='start'>· No es una decisión de TYPOGRAPHY_SYSTEM — es una hipótesis de exploración visual para esta propuesta.</text>
